  # Handles
  #=======================================================================================================

  handles:
    accessibleRoleDescription: custom slider
    asymmetricTriangleDepthHandle:
      accessibleName:           depth handle
      accessibleHelpText:       Steepen or soften the slope of the triangular well and watch the energy spacing respond.
      accessibleObjectResponse: '{$depth} electron volts'
    asymmetricTriangleWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Widen or narrow the triangular well and reshape where the system can be found.
      accessibleObjectResponse: '{$width} nanometers'
    coulombWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Scale the Coulomb well and explore its closely spaced ladder of energy levels.
      accessibleObjectResponse: '{$width} nanometers'
    finiteSquareDepthHandle:
      accessibleName:           depth handle
      accessibleHelpText:       Deepen or raise the well wall and change how many energy levels stay bound inside.
      accessibleObjectResponse: '{$depth} electron volts'
    finiteSquareWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Widen or narrow the well and watch the energy levels and the spread of the wave function respond.
      accessibleObjectResponse: '{$width} nanometers'
    finiteSquareSeparationHandle:
      accessibleName:           separation handle
      accessibleHelpText:       Bring the two wells together or apart and watch the bonding and antibonding levels split or merge.
      accessibleObjectResponse: '{$separation} nanometers'
    harmonicOscillatorWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Change the spring constant of the parabolic well and reshape its evenly spaced energy ladder.
      accessibleObjectResponse: '{$width} nanometers'
    infiniteSquareWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Widen or narrow the box and watch the energy levels move closer together or farther apart.
      accessibleObjectResponse: '{$width} nanometers'
    infiniteStepWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Set how far the low-energy region extends before the step.
      accessibleObjectResponse: '{$width} nanometers'
    infiniteStepHeightHandle:
      accessibleName:           step height handle
      accessibleHelpText:       Raise or lower the step and change which states stay bound.
      accessibleObjectResponse: '{$stepHeight} electron volts'
    morseDepthHandle:
      accessibleName:           depth handle
      accessibleHelpText:       Deepen the Morse well and change how many vibrational levels it can hold.
      accessibleObjectResponse: '{$depth} electron volts'
    morseWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Change the width of the Morse well and reshape its uneven energy spacing.
      accessibleObjectResponse: '{$width} nanometers'
    poschlTellerDepthHandle:
      accessibleName:           depth handle
      accessibleHelpText:       Deepen the anharmonic well and change how many energy levels it can hold.
      accessibleObjectResponse: '{$depth} electron volts'
    poschlTellerWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Change the width of the anharmonic well and reshape its energy spacing.
      accessibleObjectResponse: '{$width} nanometers'
    poschlTellerSpacingHandle:
      accessibleName:           spacing handle
      accessibleHelpText:       Change the separation between the anharmonic wells and watch the levels split or merge.
      accessibleObjectResponse: '{$spacing} nanometers'

  #=======================================================================================================
  # Graphs
  #=======================================================================================================

  energyDiagram:
    accessibleHeading: Energy Diagram
    accessibleTemplate:
      leadingParagraph: >-
                        The Energy Diagram shows the POTENTIALTYPE potential energy curve in purple, with NUMBEROFLEVELS green energy levels. Energy level INDEX is selected at ENERGYLEVEL electron volts.

  probabilityDensityGraph:
    accessibleHeading: Probability Density Graph
    accessibleTemplate:
      leadingParagraph: >-
                        The Probability Density graph shows the magnitude of the wave function squared for energy level INDEX. The curve has NUMBEROFNODES nodes and keeps the same shape as time evolves.

  waveFunctionGraph:
    accessibleHeading: Wave Function Graph
    accessibleTemplate:
      leadingParagraph: >-
                        The Wave Function graph shows the wave function for energy level INDEX. The real part oscillates purple and the imaginary part in orange, while the magnitude stays steady.

