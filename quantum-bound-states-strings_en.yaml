# Strings for PhET's Quantum Bound States simulation

# Simulation Title
quantum-bound-states.title:            Quantum Bound States

# Screen Names
screen.oneWell:                        One Well
screen.superposition:                  Superposition
screen.twoWells:                       Two Wells
screen.manyWells:                      Many Wells

# Preferences
phaseFeatureControl:
  label:       Wave Function Phase
  description: Adds a Phase checkbox to control panels for showing and hiding the phase of the wave function.

# Titles
potentialEnergy:                       Potential Energy
totalEnergy:                           Total Energy
position_nm:                           Position (nm)
energy_eV:                             Energy (eV)
probabilityDensity:                    Probability Density
waveFunction:                          Wave Function
quantumStateGraph:                     Quantum State Graph
energyDiagram:                         Energy Diagram

# Buttons
probabilityDensityDetailsButton:       '|Ψ(x,t)|<sup>2</sup> = ...'
waveFunctionDetailsButton:             'Ψ(x,t) = ...'

# Checkboxes
values:                                Values
realPart:                              Real Part
imaginaryPart:                         Imaginary Part
magnitude:                             Magnitude
phase:                                 Phase
magnifier:                             Magnifier
referenceLine:                         Reference Line

# ComboBoxes
superposition:                         Superposition

# Dialogs
probabilityDensityDialogTitle:         Probability Density
waveFunctionDialogTitle:               Wave Function
superpositionDetailsDialogTitle:       Superposition Details
superpositionCustomizationDialogTitle: Superposition Customization

# Handles
widthPattern:                          'width = {{value}} nm'
depthPattern:                          'depth = {{value}} eV'
stepHeightPattern:                     'step height = {{value}} eV'
spacingPattern:                        'spacing = {{value}} nm'
separationPattern:                     'separation = {{value}} nm'

# Sliders
mass:                                  Mass
numberOfWells:                         Number of Wells
electricField:                         Electric Field
slow:                                  slow
fast:                                  fast

# Spinners
energyLevel:                           Energy Level
energyLevelPattern:                    E<sub>{{index}}</sub>
energyOffset:                          Energy Offset

# Toggles and Switches
preset:                                Preset
custom:                                Custom

# Units
units:
  # mass
  electronMasses:
    symbol:        m<sub>e</sub>
    symbolPattern: '{{value}} m<sub>e</sub>'
  # energy
  electronVolts:
    symbol:        eV
    symbolPattern: '{{value}} eV'
  # spring constant
  electronVoltsPerNanometerSquared:
    symbol:        eV/nm<sup>2</sup>
    symbolPattern: '{{value}} eV/nm<sup>2</sup>'
  # time
  femtoseconds:
    symbol:        fs
    symbolPattern: '{{value}} fs'
  # angular frequency of Harmonic Oscillator
  inverseFemtoseconds:
    symbol:        fs<sup>-1</sup>
    symbolPattern: '{{value}} fs<sup>-1</sup>'
  # probability density y-values
  inverseNanometers:
    symbol:        nm<sup>-1</sup>
    symbolPattern: '{{value}} nm<sup>-1</sup>'
  # wave function y-values
  inverseSquareRootNanometers:
    symbol:        nm<sup>-1/2</sup>
    symbolPattern: '{{value}} nm<sup>-1/2</sup>'
  # electric field
  voltsPerNanometer:
    symbol:        V/nm
    symbolPattern: '{{value}} V/nm'

# Potential Wells
potentialWells:
  finiteSquare:       Finite Square
  infiniteSquare:     Infinite Square
  doubleSquare:       Double Square
  asymmetricTriangle: Asymmetric Triangle
  harmonicOscillator: Harmonic Oscillator
  poschlTeller:       Pöschl-Teller
  morse:              Morse
  coulomb:            Coulomb
  infiniteStep:       Infinite Step

# Superposition configurations
superpositionConfigurations:
  groundState0:
    preset1: cΨ<sub>0</sub> + cΨ<sub>1</sub>
    preset2: cΨ<sub>0</sub> + cΨ<sub>2</sub>
    preset3: cΨ<sub>0</sub> - cΨ<sub>1</sub>
    preset4: cΨ<sub>0</sub> + cΨ<sub>1</sub> + cΨ<sub>2</sub>
  groundState1:
    preset1: cΨ<sub>1</sub> + cΨ<sub>2</sub>
    preset2: cΨ<sub>1</sub> + cΨ<sub>3</sub>
    preset3: cΨ<sub>1</sub> - cΨ<sub>2</sub>
    preset4: cΨ<sub>1</sub> + cΨ<sub>2</sub> + cΨ<sub>3</sub>
  preset5: Localized Particle
  custom1: Custom 1
  custom2: Custom 2
  custom3: Custom 3
  custom4: Custom 4
  custom5: Custom 5

# Magnifier
magnificationPower:                    '{{value}}×'

# Keyboard Help
keyboardHelp:
  comboBox:
    heading: Combo Boxes
  potentialHandles:
    heading: Potential Handles
  referenceLine:
    heading:    Reference Line
    readValues: Read values

# Strings that are specific to accessibility
a11y:

  #=======================================================================================================
  # Screens (screen summaries, screen buttons)
  #=======================================================================================================

  screens:

    # Defaults for all screens
    defaults:
      screenSummary:
        currentDetails:
          leadingParagraph: Currently,
          listItems:
            selectedPotential:    The potential well type is {$potentialName}.
            selectedGraph:        '{ $graphName } displayed for energy level { $energyLevelIndex }.'
            referenceLineIsAdded: Reference Line is added.
            magnifierIsAdded:     Magnifier is added.
            simState:
              select_isPlaying:
                true:  The sim is playing.
                false: The sim is paused.
            simSpeed:             Sim speed is set to SIM_SPEED.

    oneWellScreen:
      screenButtonsHelpText: Explore bound states in various single well potentials.
      screenSummary:
        playArea:
          energyDiagram:     |-
                             In the Energy Diagram, observe the energy level structure of the chosen potential well.
                             Adjust the available parameters for each potential well type and explore the changes to
                             the energy levels. Change the potential well type to explore different shapes. You can
                             also change the mass of the system.
          quantumStateGraph: |-
                             In the Quantum State Graph, you can observe the probability density or wave function for
                             the selected energy level. View the full equation for the given state graph. If viewing
                             the wave function, you can toggle parts of the graph, such as the real or imaginary part.
                             There is also an option to show the magnitude and, if enabled, the phase of the wave function.
        controlArea:     |-
                         There are a few controls for visual inspection of the energy diagram or controlling the speed
                         of the simulation. Toggle the visual labels on the energy diagram. Add a reference line to 
                         visually compare the probability density or wave function to the boundaries of the potential
                         well. A magnifier can aid in telling apart closely spaced energy levels. You can track the
                         time the system has been evolving or hide it. There are controls to pause, step through, or 
                         restart the system. For slowly evolving states, you can increase the sim speed.

        interactionHint: Select an energy level or change the properties of the well to begin exploring.

    twoWellsScreen:
      screenButtonsHelpText: Explore bound states and molecular bonding in two closely separated potentials.
      screenSummary:
        playArea:
          energyDiagram:     |-
                             In the Energy Diagram, observe the energy levels of two closely spaced potential wells,
                             a simple model of a two-atom molecule. Drag the handles on the curve to change the well width,
                             the well height, and the separation between the wells, and explore how the energy levels and
                             states respond as the wells move together or apart. Change the potential well type to explore
                             a different two-well shape.
          quantumStateGraph: |-
                             In the Quantum State Graph, you can observe the probability density or wave function for the 
                             selected energy level. If viewing the wave function, you can toggle parts of the graph, such
                             as the real or imaginary part, the magnitude, and, if enabled, the phase.
        controlArea:     |-
                         There are tools for inspecting the graphs and options for controlling the speed of the
                         simulation. Toggle the value labels on the Energy Diagram. Add a Reference Line to compare
                         the graphs to the boundaries of the wells. A Magnifier can aid in telling apart closely 
                         spaced energy levels. You can track the time the system has been evolving or hide it.
                         There are controls to pause, step through, or restart the system. For slowly evolving states,
                         you can increase the sim speed.

        currentDetails:  |-
                         Currently,
                           The potential well type is POTENTIAL_TYPE.
                           GRAPH_TYPE_RADIO_BUTTON graph displayed for energy level INDEX.
                           Reference line is added.
                           Magnifier is added.
                           The system is SIM_STATE.
                           Sim speed is set to SIM_SPEED.

        interactionHint: Bring the two wells together or move them apart, and explore what happens to the energy levels.

    manyWellsScreen:
      screenButtonsHelpText: Explore bound states and band structure in a periodic array of potentials.
      screenSummary:
        playArea:
          energyDiagram:     |-
                             In the Energy Diagram, observe how a row of identical wells builds a lattice. Drag the handles
                             on the curve to change the well width, the well height, and the separation between wells. Add
                             or remove wells and explore how the energy levels respond as the lattice grows. Apply an
                             electric field and explore its effect on the energy levels. Change the potential well type to
                             explore a different lattice shape.
          quantumStateGraph: |-
                             In the Quantum State Graph, you can observe the probability density or wave function for the
                             selected energy level, or the average probability density across a whole band.
        controlArea:     |-
                         There are controls for building the lattice and for controlling the speed of the simulation.
                         Set the number of wells in the lattice and apply an electric field. Toggle the value labels
                         on the Energy Diagram, add a Reference Line, and add a Magnifier, which is especially handy
                         for telling apart closely spaced energy levels. Zoom the energy axis in or out. You can track
                         the time the system has been evolving or hide it. There are controls to pause, step through,
                         or restart the system. For slowly evolving states, you can increase the sim speed.

        currentDetails:  |-
                         Currently,
                           The potential well type is POTENTIAL_TYPE.
                           Number of wells set to NUMBER_OF_WELLS.
                           Electric field set to ELECTRIC_FIELD volts per nanometer.
                           GRAPH_TYPE_RADIO_BUTTON graph displayed for energy level INDEX.
                           Reference line is added.
                           Magnifier is added.
                           The system is SIM_STATE.
                           Sim speed is set to SIM_SPEED.

        interactionHint: Add more wells and explore what happens to the energy levels. Turn on an electric field and explore its effect.

    superpositionScreen:
      screenButtonsHelpText: Explore superposition states and their time-dependent behavior for various potentials.
      screenSummary:
        playArea:
          energyDiagram:     |-
                             In the Energy Diagram, observe the energy levels of the chosen potential. The levels that
                             contribute to the current superposition are emphasized in proportion to their weight. Change
                             the potential well type to explore a different shape.
          quantumStateGraph: |-
                             In the Quantum State Graph, you can observe the probability density or wave function for the
                             current superposition state. Press Play to explore how this state changes over time. Open the
                             Details to view the full equation along with the magnitude and phase of each contributing level.

        controlArea:     |-
                         There are controls for building superpositions and for controlling the speed of the simulation.
                         Switch between curated Preset combinations and your own Custom combinations, and open Customize
                         to set the magnitude and phase of each level. Toggle the value labels on the Energy Diagram,
                         add a Reference Line, and add a Magnifier. You can track the time the system has been evolving
                         or hide it. There are controls to pause, step through, or restart the system. For slowly
                         evolving states, you can increase the sim speed.

        currentDetails:  |-
                         Currently,
                           The potential well type is POTENTIAL_TYPE.
                           Superposition set to preset SUPERPOSITION_ACCORDION_BOX_OPTION.
                           GRAPH_TYPE_RADIO_BUTTON graph displayed.
                           Reference line is added.
                           Magnifier is added.
                           The system is SIM_STATE.
                           Sim speed is set to SIM_SPEED.

        interactionHint: Choose a preset superposition and press Play to explore how it changes over time.

  #=======================================================================================================
  # Headings
  #=======================================================================================================

  energyDiagramControls:
    accessibleHeading: Energy Diagram Controls

  quantumStateGraphControls:
    accessibleHeading: Quantum State Graph Controls

  waveFunctionParts:
    accessibleHeading: Wave Function Parts

  timeControls:
    accessibleHeading: Time Controls

  toolControls:
    accessibleHeading: Tool Controls

  #=======================================================================================================
  # Checkboxes
  #=======================================================================================================

  valuesCheckbox:
    accessibleHelpText:                 Keep values visible for handles and energy levels.
    accessibleContextResponseChecked:   Values stay visible.
    accessibleContextResponseUnchecked: Values shown on focus.

  realPartCheckbox:
    accessibleHelpText:                 Show or hide real part of wave function.
    accessibleContextResponseChecked:   Real part shown.
    accessibleContextResponseUnchecked: Real part hidden.

  imaginaryPartCheckbox:
    accessibleHelpText:                 Show or hide imaginary part of wave function.
    accessibleContextResponseChecked:   Imaginary part shown.
    accessibleContextResponseUnchecked: Imaginary part hidden.

  magnitudeCheckbox:
    accessibleHelpText:                 Show or hide magnitude of wave function.
    accessibleContextResponseChecked:   Magnitude shown.
    accessibleContextResponseUnchecked: Magnitude hidden.

  phaseCheckbox:
    accessibleHelpText:                 Show or hide phase of wave function.
    accessibleContextResponseChecked:   Phase shown.
    accessibleContextResponseUnchecked: Phase hidden.

  magnifierCheckbox:
    accessibleHelpText:                 Show or hide magnifier.
    accessibleContextResponseChecked:   Magnifier shown.
    accessibleContextResponseUnchecked: Magnifier hidden.

  referenceLineCheckbox:
    accessibleHelpText:                 Show or hide vertical Reference Line across Energy Diagram and Quantum State Graph.
    accessibleContextResponseChecked:   Reference Line shown.
    accessibleContextResponseUnchecked: Reference Line hidden.

  #=======================================================================================================
  # ComboBoxes
  #=======================================================================================================

  potentialComboBox:
    accessibleName:     Potential
    accessibleHelpText: Choose a potential shape for Energy Diagram.

  superpositionPresetComboBox:
    accessibleName:     Superposition Preset
    accessibleHelpText: Choose a ready-made combination of energy levels to explore as a superposition.

  superpositionCustomComboBox:
    accessibleName:     Superposition Custom
    accessibleHelpText: Choose one of your saved custom superpositions to explore.
    groundState0:
      accessibleNamePreset1: c times psi sub 0 plus c times psi sub 1
      accessibleNamePreset2: c times psi sub 0 plus c times psi sub 2
      accessibleNamePreset3: c times psi sub 0 minus c times psi sub 1
      accessibleNamePreset4: c times psi sub 0 plus c times psi sub 1 plus c times psi sub 2
    groundState1:
      accessibleNamePreset1: c times psi sub 1 plus c times psi sub 2
      accessibleNamePreset2: c times psi sub 1 plus c times psi sub 3
      accessibleNamePreset3: c times psi sub 1 minus c times psi sub 2
      accessibleNamePreset4: c times psi sub 1 plus c times psi sub 2 plus c times psi sub 3

  #=======================================================================================================
  # Dialogs
  #=======================================================================================================

  probabilityDensityDetailsDialog:
    accessibleParagraph: |-
                         PLACEHOLDER_FOR_EQUATION The probability density of the selected state equals the magnitude
                         of the wave function squared.

  waveFunctionDetailsDialog:
    accessibleParagraph: |-
                         PLACEHOLDER_FOR_EQUATION The wave function of the selected state, psi of x and t, equals
                         psi times exp of negative i E t over h-bar.

  #=======================================================================================================
  # Handles
  #=======================================================================================================

  handles:
    accessibleRoleDescription: custom slider
    asymmetricTriangleDepthHandle:
      accessibleName:           depth handle
      accessibleHelpText:       Steepen or soften the slope of the triangular well and observe how the energy levels respond.
      accessibleObjectResponse: '{$depth} electron volts'
    asymmetricTriangleWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Widen or narrow the triangular well and observe how the energy levels and wave function respond.
      accessibleObjectResponse: '{$width} nanometers'
    coulombWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Scale the Coulomb well and explore how its energy levels respond.
      accessibleObjectResponse: '{$width} nanometers'
    finiteSquareDepthHandle:
      accessibleName:           depth handle
      accessibleHelpText:       Deepen or raise the well wall and observe how the energy levels respond.
      accessibleObjectResponse: '{$depth} electron volts'
    finiteSquareWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Widen or narrow the well and observe how the energy levels and wave function respond.
      accessibleObjectResponse: '{$width} nanometers'
    finiteSquareSeparationHandle:
      accessibleName:           separation handle
      accessibleHelpText:       Bring the two wells together or apart and observe how the energy levels respond.
      accessibleObjectResponse: '{$separation} nanometers'
    harmonicOscillatorWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Change the spring constant of the parabolic well and observe how the energy levels respond.
      accessibleObjectResponse: '{$width} nanometers'
    infiniteSquareWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Widen or narrow the box and observe how the energy levels respond.
      accessibleObjectResponse: '{$width} nanometers'
    infiniteStepWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Set how far the low-energy region extends before the step, and observe how the energy levels respond.
      accessibleObjectResponse: '{$width} nanometers'
    infiniteStepHeightHandle:
      accessibleName:           step height handle
      accessibleHelpText:       Raise or lower the step and observe how the energy levels respond.
      accessibleObjectResponse: '{$stepHeight} electron volts'
    morseDepthHandle:
      accessibleName:           depth handle
      accessibleHelpText:       Deepen the Morse well and observe how the energy levels respond.
      accessibleObjectResponse: '{$depth} electron volts'
    morseWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Change the width of the Morse well and observe how the energy levels respond.
      accessibleObjectResponse: '{$width} nanometers'
    poschlTellerDepthHandle:
      accessibleName:           depth handle
      accessibleHelpText:       Deepen the anharmonic well and observe how the energy levels respond.
      accessibleObjectResponse: '{$depth} electron volts'
    poschlTellerWidthHandle:
      accessibleName:           width handle
      accessibleHelpText:       Change the width of the anharmonic well and observe how the energy levels respond.
      accessibleObjectResponse: '{$width} nanometers'
    poschlTellerSpacingHandle:
      accessibleName:           spacing handle
      accessibleHelpText:       Change the separation between the anharmonic wells and observe how the energy levels respond.
      accessibleObjectResponse: '{$spacing} nanometers'

  #=======================================================================================================
  # Graphs
  #=======================================================================================================

  energyDiagram:
    accessibleHeading: Energy Diagram
    accessibleTemplate:
      leadingParagraph: |-
                        The Energy Diagram shows the POTENTIAL_TYPE potential energy curve in blue, 
                        with NUMBER_OF_LEVELS green energy levels. Energy level INDEX is selected at
                        ENERGY_LEVEL electron volts.

  probabilityDensityGraph:
    accessibleHeading: Probability Density Graph
    accessibleTemplate:
      leadingParagraph: |-
                        The Probability Density graph shows the probability density across the well
                        for energy level INDEX. The curve has NUMBER_OF_NODES nodes. Listen to the shape
                        with sonification, or move the Reference Line to read the value at any position.

  waveFunctionGraph:
    accessibleHeading: Wave Function Graph
    accessibleTemplate:
      leadingParagraph: |-
                        The Wave Function graph shows the real, imaginary, and magnitude parts of the wave function
                        across the well for energy level INDEX, drawn in magenta, orange, and black. Listen to each
                        part with sonification, move the Reference Line to read values, and play time to explore
                        how the parts behave.

  #=======================================================================================================
  # Push Buttons
  #=======================================================================================================

  timeButtonGroup:
    accessibleHeading:  Time Buttons
    accessibleHelpText: Restart, play, pause, and step the system forward in time.

  restartButton:
    accessibleHelpText:        Reset the clock to zero without changing any well or energy settings.
    accessibleContextResponse: Time reset.

  playPauseButton:
    accessibleHelpTextPlaying: Pause to stop time and inspect the current state.
    accessibleHelpTextPaused:  Play to start time and explore what happens.

  stepForwardButton:
    accessibleHelpText:        Step forward time while paused.
    accessibleContextResponse: Stepped forward.

  probabilityDensityDetailsButton:
    accessibleName:            Probability Density Details
    accessibleHelpText:        Open the full equation for the probability density of the selected state.
    accessibleContextResponse: Probability Density equation shown.

  waveFunctionDetailsButton:
    accessibleName:            Wave Function Details
    accessibleHelpText:        Open the full equation for the wave function of the selected state.
    accessibleContextResponse: Wave Function equation shown.

  superpositionCustomizationButton:
    accessibleName:            Superposition Customization
    accessibleHelpText:        Open the Customize Superposition dialog to set the magnitude and phase of each energy level.
    accessibleContextResponse: Superposition Customization dialog opened.

  superpositionDetailsButton:
    accessibleName:            Superposition Details
    accessibleHelpText:        Open the full equation and coefficient list for the current superposition state.
    accessibleContextResponse: Superposition Details dialog opened.

  yAxisZoomButtonGroup:
    zoomInButton:
      accessibleName:            Zoom In
      accessibleHelpText:        Zoom in y axis for Energy Diagram.
      accessibleContextResponse: 'zoomed in, y range {$min} to {$max}'
    zoomOutButton:
      accessibleName:            Zoom Out
      accessibleHelpText:        Zoom out y axis for Energy Diagram.
      accessibleContextResponse: 'zoomed out, y range {$min} to {$max}'

  #=======================================================================================================
  # Radio Buttons
  #=======================================================================================================

  # Radio buttons for selecting which Quantum State Graph to display below the Energy Diagram.
  quantumStateGraphRadioButtonGroup:
    accessibleName:     Quantum State Graph
    accessibleHelpText: Choose which representation of the selected state to graph below the Energy Diagram.

  #=======================================================================================================
  # Sliders
  #=======================================================================================================

  timeSpeedSlider:
    accessibleName:     Time Speed
    accessibleHelpText: Speed up or slow down how fast time evolves, from Slow to Fast.

  electronMassesControl:
    accessibleHelpText: Adjust the relative mass of the system and explore how the wave function and energy levels respond.

  numberOfWellsControl:
    accessibleHelpText: Add or remove wells in the lattice and observe how the energy levels respond.

  electricFieldControl:
    accessibleHelpText: Apply an electric field and explore its effect on the energy levels.

  #=======================================================================================================
  # Spinners
  #=======================================================================================================

  energyLevelSpinner:
    accessibleName:     Energy Level
    accessibleHelpText: Step up or down through the energy levels and observe the selected state change in both graphs.

  energyOffsetSpinner:
    accessibleName:     Energy Offset
    accessibleHelpText: Shift the zero of the energy scale up or down.

  #=======================================================================================================
  # Toggle Buttons and Switches
  #=======================================================================================================

  timeDisplayToggleButton:
    accessibleNameOn:             Hide Time Display
    accessibleNameOff:            Show Time Display
    accessibleHelpText:           Show or hide the elapsed time readout in femtoseconds.
    accessibleContextResponseOn:  Time display shown.
    accessibleContextResponseOff: Time display hidden.

  curvesVisibleToggleButton:
    accessibleNameOn:             Hide Curves
    accessibleNameOff:            Show Curves
    accessibleHelpTextOn:         Hide the curves to predict their shape, then reveal them to check.
    accessibleHelpTextOff:        Show the curves to reveal the shape of the state.
    accessibleContextResponseOn:  Curves shown.
    accessibleContextResponseOff: Curves hidden.

  presetCustomSwitch:
    accessibleHelpText: Switch between curated preset superpositions and your own custom superpositions.

  #=======================================================================================================
  # Tools
  #=======================================================================================================

  magnifier:
    accessibleHeading:   Magnifier
    accessibleParagraph: The Magnifier shows a zoomed-in view of part of the Energy Diagram, helpful for telling apart closely spaced energy levels.
    probe:
      accessibleName:           Magnifier Probe
      accessibleHelpText:       Move the probe over the Energy Diagram to choose what the magnifier shows.
      accessibleObjectResponse: probe centered at POSITION nanometers
    body:
      accessibleName:           Magnifier Body
      accessibleHelpText:       Move the magnified view window to a comfortable spot.
      accessibleObjectResponse: lens at POSITION nanometers

  referenceLine:
    accessibleRoleDescription: custom slider
    accessibleName:            Reference Line
    accessibleHelpText:        Move across graphs to set a reference position.
    accessibleObjectResponse:
      joinPattern:              '{$first}, {$second}'
      positionPhrase:           at {$value} nanometers
      potentialEnergyPhrase:    potential energy is {$value} electron volts
      probabilityDensityPhrase: probability density is {$value}
      realPartPhrase:           real part is {$value}
      imaginaryPartPhrase:      imaginary part is {$value}
      magnitudePhrase:          magnitude is {$value}
      phasePhrase:              phase is {$value} radians

  #=======================================================================================================
  # Units
  #=======================================================================================================

  units:
    electronMasses:
      accessiblePattern: '{$value} times electron mass'
    electronVolts:
      accessiblePattern: '{$value} electron volts'
    electronVoltsPerNanometerSquared:
      accessiblePattern: '{$value} electron volts per nanometer squared'
    femtoseconds:
      accessiblePattern: '{$value} femtoseconds'
    inverseFemtoseconds:
      accessiblePattern: '{$value} per femtosecond'
    inverseNanometers:
      accessiblePattern: '{$value} inverse nanometers'
    inverseSquareRootNanometers:
      accessiblePattern: '{$value} inverse square root nanometers'
    voltsPerNanometer:
      accessiblePattern: '{$value} volts per nanometer'

  #=======================================================================================================
  # Values
  #=======================================================================================================

  values:
    positiveInfinity: 'positive infinity'
    negativeInfinity: 'negative infinity'