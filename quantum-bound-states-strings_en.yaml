energyOffset:                          Energy Offset

# Toggles and Switches
preset:                                Preset
custom:                                Custom

# Units
units:
  # mass
  electronMasses:
    symbol:        m<sub>e</sub>
    symbolPattern: '{{value}} m<sub>e</sub>'
  # energy
  electronVolts:
    symbol:        eV
    symbolPattern: '{{value}} eV'
  # spring constant
  electronVoltsPerNanometerSquared:
    symbol:        eV/nm<sup>2</sup>
    symbolPattern: '{{value}} eV/nm<sup>2</sup>'
  # time
  femtoseconds:
    symbol:        fs
    symbolPattern: '{{value}} fs'
  # angular frequency of Harmonic Oscillator
  inverseFemtoseconds:
    symbol:        fs<sup>-1</sup>
    symbolPattern: '{{value}} fs<sup>-1</sup>'
  # probability density y-values
  inverseNanometers:
    symbol:        nm<sup>-1</sup>
    symbolPattern: '{{value}} nm<sup>-1</sup>'
  # wave function y-values
  inverseSquareRootNanometers:
    symbol:        nm<sup>-1/2</sup>
    symbolPattern: '{{value}} nm<sup>-1/2</sup>'
  # electric field
  voltsPerNanometer:
    symbol:        V/nm
    symbolPattern: '{{value}} V/nm'

# Potential Wells
potentialWells:
  finiteSquare:       Finite Square
  infiniteSquare:     Infinite Square
  doubleSquare:       Double Square
  asymmetricTriangle: Asymmetric Triangle
  harmonicOscillator: Harmonic Oscillator
  poschlTeller:       Pöschl-Teller
  morse:              Morse
  coulomb:            Coulomb
  infiniteStep:       Infinite Step

# Superposition configurations
superpositionConfigurations:
  groundState0:
    preset1: cΨ<sub>0</sub> + cΨ<sub>1</sub>
    preset2: cΨ<sub>0</sub> + cΨ<sub>2</sub>
    preset3: cΨ<sub>0</sub> - cΨ<sub>1</sub>
    preset4: cΨ<sub>0</sub> + cΨ<sub>1</sub> + cΨ<sub>2</sub>
  groundState1:
    preset1: cΨ<sub>1</sub> + cΨ<sub>2</sub>
    preset2: cΨ<sub>1</sub> + cΨ<sub>3</sub>
    preset3: cΨ<sub>1</sub> - cΨ<sub>2</sub>
    preset4: cΨ<sub>1</sub> + cΨ<sub>2</sub> + cΨ<sub>3</sub>
  preset5: Localized Particle
  custom1: Custom 1
  custom2: Custom 2
  custom3: Custom 3
  custom4: Custom 4
  custom5: Custom 5

# Magnifier
magnificationPower:                    '{{value}}×'

# Keyboard Help
keyboardHelp:
  comboBox:
    heading: Combo Boxes
  potentialHandles:
    heading: Potential Handles
  referenceLine:
    heading:    Reference Line
    readValues: Read values

# Strings that are specific to accessibility
a11y:

  #=======================================================================================================
  # Screens (screen summaries, screen buttons)
  #=======================================================================================================

  screens:

    oneWellScreen:
      screenButtonsHelpText: Explore bound states in various single well potentials.
      screenSummary:
        playArea: >-
                  In the Energy Diagram, observe the energy level structure of the chosen potential well. Adjust the available parameters for each potential well type and explore the changes to the energy levels. Change the potential well type to explore different shapes. You can also change the mass of the system.
                  
                  In the Quantum State Graph, you can observe the probability density or wave function for the selected energy level. View the full equation for the given state graph. If viewing the wave function, you can toggle parts of the graph, such as the real or imaginary part. There is also an option to show the magnitude and, if enabled, the phase of the wave function.
        
        controlArea:  >- 
                      There are a few controls for visual inspection of the energy diagram or controlling the speed of the simulation. Toggle the visual labels on the energy diagram. Add a reference line to visually compare the probability density or wave function to the boundaries of the potential well. A magnifier can aid in visually inspecting the splitting between closely space energy levels. You can track the time the system has been evolving or hide it. There are controls to pause, step through, or restart the system. For slowly evolving states, you can increase the sim speed.

        currentDetails: >-
                        Currently,
                          
                          The potential well type is POTENTIALTYPE.
                          Well width set to WELLWIDTH nanometers.
                          Well height set to WELLHEIGHT electron volts. 
                          Energy level INDEX is at ENERGYLEVEL electron volts.
                          GRAPHTYPERADIOBUTTON graph displayed for energy level INDEX.
                          Reference line is added.
                          Magnifier is added.
                          Sim speed is set to SIMSPEED.

        interactionHint: Select an energy level or change the properties of the well to begin exploring. 

    twoWellsScreen:
      screenButtonsHelpText: Explore bound states and molecular bonding in two closely separated potentials.
      screenSummary:
        playArea: >-
                  In the Energy Diagram, observe the energy levels of two closely spaced potential wells, a simple model of a two-atom molecule. Drag the handles on the curve to change the well width, the well height, and the separation between the wells. Watch closely spaced pairs of levels split apart into bonding and antibonding states as the wells move together, and merge back together as the wells move apart. Change the potential well type to explore a different two-well shape.

                  In the Quantum State Graph, you can observe the probability density or wave function for the selected energy level. If viewing the wave function, you can toggle parts of the graph, such as the real or imaginary part, the magnitude, and, if enabled, the phase.

        controlArea: >-
                     There are tools inspectiing the graphs and options for controlling the speed of the simulation. Toggle the value labels on the Energy Diagram. Add a Reference Line to compare the graphs to the boundaries of the wells. A Magnifier can aid in visually inspecting the splitting between closely spaced energy levels. You can track the time the system has been evolving or hide it. There are controls to pause, step through, or restart the system. For slowly evolving states, you can increase the sim speed.

        currentDetails: >-
                        Currently,

                          The potential well type is POTENTIALTYPE.
                          Well width set to WELLWIDTH nanometers.
                          Well height set to WELLHEIGHT electron volts.
                          Well separation set to SEPARATION nanometers.
                          Energy level INDEX is at ENERGYLEVEL electron volts.
                          GRAPHTYPERADIOBUTTON graph displayed for energy level INDEX.
                          Values are shown.
                          Reference line is added.
                          Magnifier is added.
                          Sim speed is set to SIMSPEED.

        interactionHint: Bring the two wells together or move them apart, and watch the energy levels split and merge.

    manyWellsScreen:
      screenButtonsHelpText: Explore bound states and band structure in a periodic array of potentials.
      screenSummary:
        playArea: >-
                  In the Energy Diagram, observe how a row of identical wells builds a lattice. As you add wells, the discrete energy levels gather into bands separated by gaps. Drag the handles on the curve to change the well width, the well height, and the separation between wells. Apply an electric field to tilt the lattice and distort the bands. Change the potential well type to explore a different lattice shape.

                  In the Quantum State Graph, you can observe the probability density or wave function for the selected energy level, or the average probability density across a whole band.

        controlArea: >-
                     There are controls for building the lattice and for controlling the speed of the simulation. Set the number of wells in the lattice and apply an electric field. Toggle the value labels on the Energy Diagram, add a Reference Line, and add a Magnifier, which is especially handy for counting the levels inside a band. Zoom the energy axis in or out. You can track the time the system has been evolving or hide it. There are controls to pause, step through, or restart the system. For slowly evolving states, you can increase the sim speed.

        currentDetails: >-
                        Currently,

                          The potential well type is POTENTIALTYPE.
                          Number of wells set to NUMBEROFWELLS.
                          Electric field set to ELECTRICFIELD volts per nanometer.
                          Well width set to WELLWIDTH nanometers.
                          Well separation set to SEPARATION nanometers.
                          Energy level INDEX is at ENERGYLEVEL electron volts.
                          GRAPHTYPERADIOBUTTON graph displayed for energy level INDEX.
                          Reference line is added.
                          Magnifier is added.
                          Sim speed is set to SIMSPEED.

        interactionHint: Add more wells and watch the energy levels gather into bands. Turn on an electric field to tilt the lattice.

    superpositionScreen:
      screenButtonsHelpText: Explore superposition states and their time-dependent behavior for various potentials.
      screenSummary:
        playArea: >-
                  In the Energy Diagram, observe the energy levels of the chosen potential. The levels that contribute to the current superposition are emphasized in proportion to their weight. Change the potential well type to explore a different shape.

                  In the Quantum State Graph, you can observe the probability density or wave function for the current superposition state. Unlike a single energy level, this state evolves in time, so press Play to watch the probability density ripple and beat. Open the Details to view the full equation along with the magnitude and phase of each contributing level.

        controlArea: >-
                     There are controls for building superpositions and for controlling the speed of the simulation. Switch between curated Preset combinations and your own Custom combinations, and open Customize to set the magnitude and phase of each level. Toggle the value labels on the Energy Diagram, add a Reference Line, and add a Magnifier. You can track the time the system has been evolving or hide it. There are controls to pause, step through, or restart the system. For slowly evolving states, you can increase the sim speed.

        currentDetails: >-
                        Currently,

                          The potential well type is POTENTIALTYPE.
                          Superposition set to SUPERPOSITION.
                          GRAPHTYPERADIOBUTTON graph displayed.
                          The system is SIMSTATE.
                          Elapsed time is TIME femtoseconds.
                          Reference line is added.
                          Magnifier is added.
                          Sim speed is set to SIMSPEED.

        interactionHint: Choose a preset superposition and press Play to watch the probability density evolve in time.

